name: Build Nuvio Live TV

# Builds two apps and publishes them together as a GitHub Release:
#   - Windows installer: the official Nuvio Desktop source + windows-live-tv.patch from this repository
#   - Android APKs: the official Nuvio Mobile source + android-live-tv.patch from this repository
# To update the apps, replace the two .patch files; the other files in this repository aren't used.

on:
  workflow_dispatch:
  push:
    branches:
      - Dev
      - main
      - custom/live-tv-neon
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: live-tv-build
  cancel-in-progress: true

env:
  # Newest Gradle release (see gradle.org/releases). Set to "" to use the version the source code pins.
  LATEST_GRADLE: "9.8.0"
  # The exact Nuvio Desktop source that windows-live-tv.patch was made for.
  NUVIO_DESKTOP_COMMIT: b1e00724c55e65f8f325d4d9d52eb6827872a7c2
  # The exact Nuvio Mobile source that android-live-tv.patch was made for (branch cmp-rewrite).
  NUVIO_MOBILE_COMMIT: c1065d0a2a717d7dba445257f064f3fb8d1b30a3
  # Nuvio's public account server, from nuvio.tv/docs#base-urls. Lets you sign in with your Nuvio account.
  NUVIO_API_URL: https://api.nuvio.tv
  NUVIO_API_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      # Leave persist-credentials at its default for both checkouts. Nuvio's repositories list
      # sub-projects (such as libass-android) without addresses, so git's submodule clean-up fails;
      # with the default setting that happens after the build, as a harmless warning.
      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            android-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Mobile source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ env.NUVIO_MOBILE_COMMIT }}
          path: mobile

      - name: Add Live TV to the Android app
        working-directory: mobile
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/android-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::android-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Live TV added: $(git status --short | wc -l) files changed."

      - name: Use the latest Gradle
        if: ${{ env.LATEST_GRADLE != '' }}
        working-directory: mobile
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${LATEST_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings and signing key
        working-directory: mobile
        run: |
          keystore="${RUNNER_TEMP}/live-tv.jks"
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${KEYSTORE_PASSWORD}"
          else
            echo "::warning::No LIVE_TV_KEYSTORE secrets set; using a one-off key. Installing a later build will require uninstalling this one first."
            password="live-tv-$(date +%s)"
            keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Live TV"
          fi
          {
            echo "NUVIO_SUPABASE_URL=${NUVIO_API_URL}"
            echo "NUVIO_SUPABASE_ANON_KEY=${NUVIO_API_KEY}"
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${password}"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${password}"
          } > local.properties

      - name: Build APKs
        working-directory: mobile
        run: |
          args=(:androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.android.applicationId=com.nuvio.app.livetv --stacktrace)
          if ./gradlew "${args[@]}"; then
            exit 0
          fi
          if [[ -z "${LATEST_GRADLE}" ]]; then
            exit 1
          fi
          # Safety net: if the newer Gradle is the problem, build once more with the version the source pins.
          echo "::warning::The build failed with Gradle ${LATEST_GRADLE}; trying again with the Gradle version the source code pins."
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          git checkout -- gradle/wrapper/gradle-wrapper.properties
          ./gradlew "${args[@]}"

      - name: Rename APKs
        run: |
          mkdir -p out
          for apk in mobile/androidApp/build/outputs/apk/full/release/*.apk; do
            name="$(basename "${apk}")"
            case "${name}" in
              *arm64-v8a*)   cp "${apk}" out/Nuvio-LiveTV-Android-phone.apk ;;
              *armeabi-v7a*) cp "${apk}" out/Nuvio-LiveTV-Android-older-32bit.apk ;;
              *x86_64*)      cp "${apk}" out/Nuvio-LiveTV-Android-x86_64.apk ;;
              *x86*)         cp "${apk}" out/Nuvio-LiveTV-Android-x86.apk ;;
              *)             cp "${apk}" "out/${name}" ;;
            esac
          done
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Keep line endings as they are
        shell: bash
        run: git config --global core.autocrlf false

      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            windows-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Desktop source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: ${{ env.NUVIO_DESKTOP_COMMIT }}
          path: desktop
          lfs: true

      - name: Add Live TV to the Windows app
        shell: bash
        working-directory: desktop
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/windows-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::windows-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Live TV added: $(git status --short | wc -l) files changed."

      - name: Use the latest Gradle
        if: ${{ env.LATEST_GRADLE != '' }}
        shell: bash
        working-directory: desktop
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${LATEST_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Prepare sign-in settings
        shell: bash
        working-directory: desktop
        run: |
          {
            echo "NUVIO_SUPABASE_URL=${NUVIO_API_URL}"
            echo "NUVIO_SUPABASE_ANON_KEY=${NUVIO_API_KEY}"
          } > local.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -DirectDownload -NonInteractive -NoCache
          "WEBVIEW2_ROOT=$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        working-directory: desktop
        run: |
          # Every build gets a higher version number, so a new installer cleanly replaces the previous one
          # (and the regular Nuvio desktop app, which it includes).
          $version = "0.1.$(9000 + [int]$env:GITHUB_RUN_NUMBER)"
          $gradleArgs = @(
            ":composeApp:packageReleaseMsi",
            "-Pnuvio.desktop.versionName=$version",
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT",
            "-Pcompose.desktop.packaging.checkJdkVendor=false",
            "--no-configuration-cache", "--no-daemon", "--stacktrace"
          )
          & .\gradlew.bat @gradleArgs
          if ($LASTEXITCODE -ne 0 -and $env:LATEST_GRADLE) {
            # Safety net: if the newer Gradle is the problem, build once more with the version the source pins.
            Write-Output "::warning::The build failed with Gradle $env:LATEST_GRADLE; trying again with the Gradle version the source code pins."
            Get-Process -Name java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            git checkout -- gradle/wrapper/gradle-wrapper.properties
            & .\gradlew.bat @gradleArgs
          }
          exit $LASTEXITCODE

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp desktop/composeApp/build/compose/release-msis/*.msi out/Nuvio-LiveTV-Windows.msi
          ls -la out

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, windows]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="live-tv-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          **Android:** download `Nuvio-LiveTV-Android-phone.apk` on your phone or Android TV, open it, and allow installing from this source when asked.
          It installs next to the official Nuvio app as **Nuvio Live TV**.

          **Windows:** download `Nuvio-LiveTV-Windows.msi` and double-click it.
          It replaces the regular Nuvio desktop app and keeps your settings. If Nuvio later offers an app update, skip it: that update doesn't include Live TV.

          Sign in with your Nuvio account, then open the **Live TV** tab and paste your addon's manifest link.
          NOTES
          gh release create "${tag}" dist/* --title "Nuvio Live TV — build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}" --latest
