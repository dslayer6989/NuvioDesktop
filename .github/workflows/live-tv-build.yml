name: Build Nuvio Live TV

# Builds the Windows installer and publishes it as a GitHub Release:
#   - Windows installer: the official Nuvio Desktop source + windows-live-tv.patch from this repository
# Android phones and iPhones/iPads are built in dslayer6989/NuvioMobile, and Android TV in
# dslayer6989/NuvioTV. To update the Windows app, replace windows-live-tv.patch.

on:
  workflow_dispatch:
  push:
    branches:
      - Dev
      - main
      - custom/live-tv-neon
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: live-tv-build
  cancel-in-progress: true

env:
  # The exact Nuvio Desktop source that windows-live-tv.patch was made for.
  NUVIO_DESKTOP_COMMIT: e808a584e937d3ce148f5e023180586bc3545002
  # Nuvio's public account server, from nuvio.tv/docs#base-urls. Lets you sign in with your Nuvio account.
  # These MUST stay defined: all three jobs write them into local.properties as
  # NUVIO_SUPABASE_URL / NUVIO_SUPABASE_ANON_KEY, and empty values break every sign-in path.
  NUVIO_API_URL: https://api.nuvio.tv
  NUVIO_API_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
  # The WebView2 SDK the desktop build needs. The build fails without it.
  WEBVIEW2_VERSION: "1.0.4078.44"
  # The Gradle version to fall back to if the newest release does not work. The build jobs try the
  # newest Gradle first and retry with this pinned version if that fails.
  FALLBACK_GRADLE: "9.8.0"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            windows-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Desktop source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: ${{ env.NUVIO_DESKTOP_COMMIT }}
          path: desktop

      - name: Add Live TV to the desktop app
        working-directory: desktop
        shell: pwsh
        run: |
          $patchFile = Join-Path $env:GITHUB_WORKSPACE "fork/windows-live-tv.patch"
          if (-not (Test-Path $patchFile)) {
            Write-Error "windows-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          }
          git apply --whitespace=nowarn $patchFile
          if ($LASTEXITCODE -ne 0) {
            git apply --ignore-whitespace --whitespace=nowarn $patchFile
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "windows-live-tv.patch did not apply."
            exit 1
          }
          Write-Host "Live TV added: $((git status --short | Measure-Object -Line).Lines) files changed."

      - name: Install the WebView2 SDK
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          $packages = Join-Path $env:RUNNER_TEMP "webview2"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          & $nuget install "Microsoft.Web.WebView2" -Version $env:WEBVIEW2_VERSION -OutputDirectory $packages -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not download the WebView2 SDK."
            exit 1
          }
          $root = Join-Path $packages "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WebView2 SDK at $root"

      # The desktop player is a native MPV surface. The MSI ships without
      # libmpv-2.dll unless the runtime is downloaded and passed to Gradle, and
      # without it NativePlayerBridge.create() throws "Unable to load
      # libmpv-2.dll" and every playback path strands on a black player surface.
      # Resolve the latest asset dynamically: the mpv-dev-x86_64-*.7z filename
      # changes every build, so a hardcoded URL is brittle.
      - name: Install the MPV runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mpvDir = Join-Path $env:RUNNER_TEMP "mpv"
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null

          Write-Host "Downloading latest mpv-dev-x86_64 archive from zhongfly/mpv-winbuild..."
          gh release download --repo zhongfly/mpv-winbuild --pattern "mpv-dev-x86_64-*.7z" --dir $mpvDir

          $archive = Get-ChildItem -Path $mpvDir -Filter "mpv-dev-x86_64-*.7z" |
            Where-Object { $_.Name -notmatch 'v3' } |
            Select-Object -First 1

          if (-not $archive) {
            Write-Error "Failed to locate downloaded mpv-dev archive."
            exit 1
          }

          Write-Host "Extracting $($archive.FullName)..."
          & 7z x $archive.FullName "-o$mpvDir" -y
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to extract MPV archive."
            exit 1
          }

          $dll = Get-ChildItem -Path $mpvDir -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "libmpv-2.dll was not found after extraction."
            exit 1
          }

          $runtimeDir = $dll.DirectoryName
          Write-Host "Found libmpv-2.dll in $runtimeDir"
          "MPV_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Look up the latest Gradle version
        id: gradle
        shell: pwsh
        run: |
          try {
            $latest = (Invoke-RestMethod -Uri "https://services.gradle.org/versions/current").version
          } catch {
            $latest = ""
          }
          if (-not $latest) {
            Write-Warning "Could not look up the latest Gradle version; using the pinned $env:FALLBACK_GRADLE."
            $latest = $env:FALLBACK_GRADLE
          }
          Write-Host "Using Gradle $latest (fallback $env:FALLBACK_GRADLE)."
          "version=$latest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Use the latest Gradle
        working-directory: desktop
        shell: pwsh
        run: |
          $file = "gradle/wrapper/gradle-wrapper.properties"
          (Get-Content $file) -replace "gradle-[0-9][0-9.]*-(bin|all)\.zip", "gradle-${{ steps.gradle.outputs.version }}-`$1.zip" | Set-Content $file
          Select-String -Path $file -Pattern "distributionUrl"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings
        working-directory: desktop
        shell: pwsh
        run: |
          if (-not $env:NUVIO_API_URL -or -not $env:NUVIO_API_KEY) {
            Write-Error "NUVIO_API_URL / NUVIO_API_KEY are empty; sign-in would be built pointing at localhost. Refusing to build."
            exit 1
          }
          @(
            "NUVIO_SUPABASE_URL=$env:NUVIO_API_URL"
            "NUVIO_SUPABASE_ANON_KEY=$env:NUVIO_API_KEY"
          ) | Out-File -FilePath "local.properties" -Encoding utf8

      - name: Build the installer
        working-directory: desktop
        shell: pwsh
        run: |
          $args = @(
            ":composeApp:packageReleaseMsi"
            "-Pnuvio.desktop.versionName=0.1.$((9000 + [int]$env:GITHUB_RUN_NUMBER))"
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT"
            "-Pnuvio.windows.libmpv.runtimeDir=$env:MPV_RUNTIME_DIR"
            "-Pcompose.desktop.packaging.checkJdkVendor=false"
            "--stacktrace"
          )
          & ./gradlew @args
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Warning "The build failed with Gradle ${{ steps.gradle.outputs.version }}; trying again with the pinned Gradle $env:FALLBACK_GRADLE."
          & ./gradlew --stop
          $file = "gradle/wrapper/gradle-wrapper.properties"
          (Get-Content $file) -replace "gradle-[0-9][0-9.]*-(bin|all)\.zip", "gradle-$env:FALLBACK_GRADLE-`$1.zip" | Set-Content $file
          & ./gradlew @args

      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $msi = Get-ChildItem -Path "desktop/composeApp/build/compose/release-msis/*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "out/Nuvio-LiveTV-Windows.msi"
          Get-ChildItem out

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/Nuvio-LiveTV-Windows.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="live-tv-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          **Windows desktop:** download `Nuvio-LiveTV-Windows.msi` and double-click it.
          It replaces the regular Nuvio desktop app and keeps your settings. If Nuvio later offers an app update, skip it: that update doesn't include Live TV.

          Sign in with your Nuvio account, then open the **Live TV** tab and paste your addon's manifest link.

          Android phones and iPhones/iPad: see the releases of dslayer6989/NuvioMobile. Android TV: see the releases of dslayer6989/NuvioTV.
          NOTES
          gh release create "${tag}" dist/* --title "Nuvio Live TV — build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}" --latest
