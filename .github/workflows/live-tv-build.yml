name: Build Nuvio Live TV

# Builds the Windows installer and the Android APKs from the patches in this repository, then
# publishes them as one release. Run it by hand from the Actions tab, or let a push to Dev or main
# start it. The patches are applied to the official Nuvio source at the commits pinned below.

on:
  workflow_dispatch:
  push:
    branches: [Dev, main, custom/live-tv-neon]
    paths:
      - "windows-live-tv.patch"
      - "android-live-tv.patch"
      - "android-tv-live-tv.patch"
      - ".github/workflows/live-tv-build.yml"

permissions:
  contents: write

concurrency:
  group: live-tv-build
  cancel-in-progress: false

env:
  NUVIO_DESKTOP_COMMIT: b1e00724c55e65f8f325d4d9d52eb6827872a7c2
  NUVIO_MOBILE_COMMIT: c1065d0a2a717d7dba445257f064f3fb8d1b30a3
  NUVIO_API_URL: https://api.nuvio.tv
  NUVIO_API_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
  LATEST_GRADLE: "9.8.0"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      # Leave persist-credentials at its default for both checkouts. Nuvio's repositories list
      # sub-projects (such as libass-android) without addresses, so git's submodule clean-up fails;
      # with the default setting that happens after the build, as a harmless warning.
      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            android-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Mobile source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ env.NUVIO_MOBILE_COMMIT }}
          path: mobile

      - name: Add Live TV to the Android app
        working-directory: mobile
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/android-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::android-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Live TV added: $(git status --short | wc -l) files changed."

      - name: Use the latest Gradle
        if: ${{ env.LATEST_GRADLE != '' }}
        working-directory: mobile
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${LATEST_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings and signing key
        working-directory: mobile
        run: |
          keystore="${RUNNER_TEMP}/live-tv.jks"
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${KEYSTORE_PASSWORD}"
          else
            echo "::warning::No LIVE_TV_KEYSTORE secrets set; using a one-off key. Installing a later build will require uninstalling this one first."
            password="live-tv-$(date +%s)"
            keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Live TV"
          fi
          {
            echo "NUVIO_SUPABASE_URL=${NUVIO_API_URL}"
            echo "NUVIO_SUPABASE_ANON_KEY=${NUVIO_API_KEY}"
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${password}"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${password}"
          } > local.properties

      - name: Build APKs
        working-directory: mobile
        run: |
          args=(:androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.android.applicationId=com.nuvio.app.livetv --stacktrace)
          if ./gradlew "${args[@]}"; then
            exit 0
          fi
          if [[ -z "${LATEST_GRADLE}" ]]; then
            exit 1
          fi
          # Safety net: if the newer Gradle is the problem, build once more with the version the source pins.
          echo "::warning::The build failed with Gradle ${LATEST_GRADLE}; trying again with the Gradle version the source code pins."
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          git checkout -- gradle/wrapper/gradle-wrapper.properties
          ./gradlew "${args[@]}"

      - name: Rename APKs
        run: |
          mkdir -p out
          for apk in mobile/androidApp/build/outputs/apk/full/release/*.apk; do
            name="$(basename "${apk}")"
            case "${name}" in
              *arm64-v8a*)   cp "${apk}" out/Nuvio-LiveTV-Android-phone.apk ;;
              *armeabi-v7a*) cp "${apk}" out/Nuvio-LiveTV-Android-older-32bit.apk ;;
              *x86_64*)      cp "${apk}" out/Nuvio-LiveTV-Android-x86_64.apk ;;
              *x86*)         cp "${apk}" out/Nuvio-LiveTV-Android-x86.apk ;;
              *)             cp "${apk}" "out/${name}" ;;
            esac
          done
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  android-tv:
    name: Android TV APK
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      # Leave persist-credentials at its default for both checkouts. Nuvio's repositories list
      # sub-projects (such as libass-android) without addresses, so git's submodule clean-up fails;
      # with the default setting that happens after the build, as a harmless warning.
      - name: Get the Android TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            android-tv-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Mobile source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ env.NUVIO_MOBILE_COMMIT }}
          path: mobile

      # android-tv-live-tv.patch is CUMULATIVE: it is a diff from the pinned commit to the final TV
      # tree, so it already contains everything android-live-tv.patch does. Apply it on its own to a
      # pristine checkout. Applying the phone patch first fails with "already exists in working
      # directory" (this exact failure was hit in run 37484864323).
      - name: Add the Android TV layer to the Android app
        working-directory: mobile
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/android-tv-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::android-tv-live-tv.patch was not found. Publish it from a green Regenerate Android TV patch run, then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Android TV layer added: $(git status --short | wc -l) files changed."
          # Guard against a silently empty or phone-only patch.
          for marker in "LiveTvTelevision.kt" "live_tv_banner.xml" "LEANBACK_LAUNCHER"; do
            if ! grep -q "${marker}" "${patch_file}"; then
              echo "::error::android-tv-live-tv.patch does not contain ${marker}; it is not the Android TV patch."
              exit 1
            fi
          done

      - name: Use the latest Gradle
        if: ${{ env.LATEST_GRADLE != '' }}
        working-directory: mobile
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${LATEST_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings and signing key
        working-directory: mobile
        run: |
          keystore="${RUNNER_TEMP}/live-tv.jks"
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${KEYSTORE_PASSWORD}"
          else
            echo "::warning::No LIVE_TV_KEYSTORE secrets set; using a one-off key. Installing a later build will require uninstalling this one first."
            password="live-tv-$(date +%s)"
            keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Live TV"
          fi
          {
            echo "NUVIO_SUPABASE_URL=${NUVIO_API_URL}"
            echo "NUVIO_SUPABASE_ANON_KEY=${NUVIO_API_KEY}"
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${password}"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${password}"
          } > local.properties

      - name: Build the Android TV APK
        working-directory: mobile
        run: |
          args=(:androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.android.applicationId=com.nuvio.app.livetv.atv --stacktrace)
          if ./gradlew "${args[@]}"; then
            exit 0
          fi
          if [[ -z "${LATEST_GRADLE}" ]]; then
            exit 1
          fi
          # Safety net: if the newer Gradle is the problem, build once more with the version the source pins.
          echo "::warning::The build failed with Gradle ${LATEST_GRADLE}; trying again with the Gradle version the source code pins."
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          git checkout -- gradle/wrapper/gradle-wrapper.properties
          ./gradlew "${args[@]}"

      - name: Rename the Android TV APK
        run: |
          mkdir -p out
          # The TV build ships one universal APK so it installs on Android TV, Google TV and Fire TV.
          apk="$(ls mobile/androidApp/build/outputs/apk/full/release/*universal*.apk 2>/dev/null | head -n 1)"
          if [[ -z "${apk}" ]]; then
            apk="$(ls mobile/androidApp/build/outputs/apk/full/release/*.apk | head -n 1)"
          fi
          cp "${apk}" out/Nuvio-LiveTV-Android-TV.apk
          ls -la out

      - name: Upload the Android TV APK
        uses: actions/upload-artifact@v7
        with:
          name: android-tv
          path: out/Nuvio-LiveTV-Android-TV.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            windows-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Desktop source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: ${{ env.NUVIO_DESKTOP_COMMIT }}
          path: desktop

      - name: Add Live TV to the desktop app
        working-directory: desktop
        shell: bash
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/windows-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::windows-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Live TV added: $(git status --short | wc -l) files changed."

      - name: Use the latest Gradle
        if: ${{ env.LATEST_GRADLE != '' }}
        working-directory: desktop
        shell: bash
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${LATEST_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the installer
        working-directory: desktop
        shell: bash
        run: |
          args=(:composeApp:packageMsi -Pnuvio.desktop.versionName=0.1.$((9000 + GITHUB_RUN_NUMBER)) --stacktrace)
          if ./gradlew "${args[@]}"; then
            exit 0
          fi
          if [[ -z "${LATEST_GRADLE}" ]]; then
            exit 1
          fi
          echo "::warning::The build failed with Gradle ${LATEST_GRADLE}; trying again with the Gradle version the source code pins."
          ./gradlew --stop || true
          git checkout -- gradle/wrapper/gradle-wrapper.properties
          ./gradlew "${args[@]}"

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p out
          msi="$(ls desktop/composeApp/build/compose/binaries/main/msi/*.msi | head -n 1)"
          cp "${msi}" out/Nuvio-LiveTV-Windows.msi
          ls -la out

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/Nuvio-LiveTV-Windows.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, android-tv, windows]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.android.result == 'success' || needs.android-tv.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="live-tv-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          **Android phone and tablet:** download `Nuvio-LiveTV-Android-phone.apk`, open it, and allow installing from this source when asked.
          It installs next to the official Nuvio app as **Nuvio Live TV**. The `older-32bit`, `x86` and `x86_64` files are for unusual devices; most phones want the `phone` file.

          **Android TV, Google TV and Fire TV:** download `Nuvio-LiveTV-Android-TV.apk` and install it on the TV.
          It installs next to the official Nuvio app as **Nuvio Live TV**, with a TV launcher entry and a couch-distance guide layout.
          Fire TV does not show app-provided home screen rows, so those are skipped there.

          **Windows desktop:** download `Nuvio-LiveTV-Windows.msi` and double-click it.
          It replaces the regular Nuvio desktop app and keeps your settings. If Nuvio later offers an app update, skip it: that update doesn't include Live TV.

          Sign in with your Nuvio account, then open the **Live TV** tab and paste your addon's manifest link.
          NOTES
          gh release create "${tag}" dist/* --title "Nuvio Live TV — build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}" --latest
