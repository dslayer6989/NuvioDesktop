name: Build Nuvio Live TV

# Builds three apps and publishes them together as a GitHub Release:
#   - Windows installer: the official Nuvio Desktop source + windows-live-tv.patch from this repository
#   - Android APKs: the official Nuvio Mobile source + android-live-tv.patch from this repository
#   - Android TV APK: the official Nuvio Mobile source + android-tv-live-tv.patch from this repository
# To update the apps, replace the .patch files; the other files in this repository aren't used.

on:
  workflow_dispatch:
  push:
    branches:
      - Dev
      - main
      - custom/live-tv-neon
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: live-tv-build
  cancel-in-progress: true

env:
  # The exact Nuvio Desktop source that windows-live-tv.patch was made for.
  NUVIO_DESKTOP_COMMIT: b1e00724c55e65f8f325d4d9d52eb6827872a7c2
  # The exact Nuvio Mobile source that android-live-tv.patch and android-tv-live-tv.patch were made for.
  NUVIO_MOBILE_COMMIT: c1065d0a2a717d7dba445257f064f3fb8d1b30a3
  # The WebView2 SDK the desktop build needs. The build fails without it.
  WEBVIEW2_VERSION: "1.0.4078.44"
  # The Gradle version to fall back to if the newest release does not work. The build jobs try the
  # newest Gradle first and retry with this pinned version if that fails.
  FALLBACK_GRADLE: "9.8.0"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      # Leave persist-credentials at its default for both checkouts. Nuvio's repositories list
      # sub-projects (such as libass-android) without addresses, so git's submodule clean-up fails;
      # with the default setting that happens after the build, as a harmless warning.
      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            android-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Mobile source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ env.NUVIO_MOBILE_COMMIT }}
          path: mobile

      - name: Add Live TV to the Android app
        working-directory: mobile
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/android-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::android-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Live TV added: $(git status --short | wc -l) files changed."

      - name: Look up the latest Gradle version
        id: gradle
        run: |
          latest="$(curl -fsSL https://services.gradle.org/versions/current | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "${latest}" ]]; then
            echo "::warning::Could not look up the latest Gradle version; using the pinned ${FALLBACK_GRADLE}."
            latest="${FALLBACK_GRADLE}"
          fi
          echo "Using Gradle ${latest} (fallback ${FALLBACK_GRADLE})."
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Use the latest Gradle
        working-directory: mobile
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${{ steps.gradle.outputs.version }}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings and signing key
        working-directory: mobile
        run: |
          keystore="${RUNNER_TEMP}/live-tv.jks"
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${KEYSTORE_PASSWORD}"
          else
            echo "::warning::No LIVE_TV_KEYSTORE secrets set; using a one-off key. Installing a later build will require uninstalling this one first."
            password="live-tv-$(date +%s)"
            keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Live TV"
          fi
          {
            echo "NUVIO_SUPABASE_URL=${NUVIO_API_URL}"
            echo "NUVIO_SUPABASE_ANON_KEY=${NUVIO_API_KEY}"
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${password}"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${password}"
          } > local.properties

      - name: Build APKs
        working-directory: mobile
        run: |
          args=(:androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.android.applicationId=com.nuvio.app.livetv --stacktrace)
          if ./gradlew "${args[@]}"; then
            exit 0
          fi
          # Safety net: if the newest Gradle is the problem, build once more with the pinned version.
          echo "::warning::The build failed with Gradle ${{ steps.gradle.outputs.version }}; trying again with the pinned Gradle ${FALLBACK_GRADLE}."
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${FALLBACK_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          ./gradlew "${args[@]}"

      - name: Rename APKs
        run: |
          mkdir -p out
          for apk in mobile/androidApp/build/outputs/apk/full/release/*.apk; do
            name="$(basename "${apk}")"
            case "${name}" in
              *arm64-v8a*)   cp "${apk}" out/Nuvio-LiveTV-Android-phone.apk ;;
              *armeabi-v7a*) cp "${apk}" out/Nuvio-LiveTV-Android-older-32bit.apk ;;
              *x86_64*)      cp "${apk}" out/Nuvio-LiveTV-Android-x86_64.apk ;;
              *x86*)         cp "${apk}" out/Nuvio-LiveTV-Android-x86.apk ;;
              *)             cp "${apk}" "out/${name}" ;;
            esac
          done
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  android-tv:
    name: Android TV APK
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      # Leave persist-credentials at its default for both checkouts. Nuvio's repositories list
      # sub-projects (such as libass-android) without addresses, so git's submodule clean-up fails;
      # with the default setting that happens after the build, as a harmless warning.
      - name: Get the Android TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            android-tv-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Mobile source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ env.NUVIO_MOBILE_COMMIT }}
          path: mobile

      # android-tv-live-tv.patch is CUMULATIVE: it is a diff from the pinned commit to the final TV
      # tree, so it already contains everything android-live-tv.patch does. Apply it on its own to a
      # pristine checkout. Applying the phone patch first fails with "already exists in working
      # directory" (this exact failure was hit in run 37484864323).
      - name: Add the Android TV layer to the Android app
        working-directory: mobile
        run: |
          patch_file="${GITHUB_WORKSPACE}/fork/android-tv-live-tv.patch"
          if [[ ! -f "${patch_file}" ]]; then
            echo "::error::android-tv-live-tv.patch was not found. Publish it from a green Regenerate Android TV patch run, then run this build again."
            exit 1
          fi
          git apply --whitespace=nowarn "${patch_file}" || git apply --ignore-whitespace --whitespace=nowarn "${patch_file}"
          echo "Android TV layer added: $(git status --short | wc -l) files changed."
          # Guard against a silently empty or phone-only patch.
          for marker in "LiveTvTelevision.kt" "live_tv_banner.xml" "LEANBACK_LAUNCHER"; do
            if ! grep -q "${marker}" "${patch_file}"; then
              echo "::error::android-tv-live-tv.patch does not contain ${marker}; it is not the Android TV patch."
              exit 1
            fi
          done

      - name: Look up the latest Gradle version
        id: gradle
        run: |
          latest="$(curl -fsSL https://services.gradle.org/versions/current | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "${latest}" ]]; then
            echo "::warning::Could not look up the latest Gradle version; using the pinned ${FALLBACK_GRADLE}."
            latest="${FALLBACK_GRADLE}"
          fi
          echo "Using Gradle ${latest} (fallback ${FALLBACK_GRADLE})."
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"

      - name: Use the latest Gradle
        working-directory: mobile
        run: |
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${{ steps.gradle.outputs.version }}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings and signing key
        working-directory: mobile
        run: |
          keystore="${RUNNER_TEMP}/live-tv.jks"
          if [[ -n "${KEYSTORE_BASE64}" && -n "${KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            password="${KEYSTORE_PASSWORD}"
          else
            echo "::warning::No LIVE_TV_KEYSTORE secrets set; using a one-off key. Installing a later build will require uninstalling this one first."
            password="live-tv-$(date +%s)"
            keytool -genkeypair -noprompt -keystore "${keystore}" -storepass "${password}" -keypass "${password}" \
              -alias livetv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nuvio Live TV"
          fi
          {
            echo "NUVIO_SUPABASE_URL=${NUVIO_API_URL}"
            echo "NUVIO_SUPABASE_ANON_KEY=${NUVIO_API_KEY}"
            echo "NUVIO_RELEASE_STORE_FILE=${keystore}"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${password}"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${password}"
          } > local.properties

      - name: Build the Android TV APK
        working-directory: mobile
        run: |
          args=(:androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.android.applicationId=com.nuvio.app.livetv.atv --stacktrace)
          if ./gradlew "${args[@]}"; then
            exit 0
          fi
          # Safety net: if the newest Gradle is the problem, build once more with the pinned version.
          echo "::warning::The build failed with Gradle ${{ steps.gradle.outputs.version }}; trying again with the pinned Gradle ${FALLBACK_GRADLE}."
          ./gradlew --stop || true
          pkill -f KotlinCompileDaemon || true
          sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${FALLBACK_GRADLE}-\1.zip#" gradle/wrapper/gradle-wrapper.properties
          ./gradlew "${args[@]}"

      - name: Rename the Android TV APK
        run: |
          mkdir -p out
          # The TV build ships one universal APK so it installs on Android TV, Google TV and Fire TV.
          apk="$(ls mobile/androidApp/build/outputs/apk/full/release/*universal*.apk 2>/dev/null | head -n 1)"
          if [[ -z "${apk}" ]]; then
            apk="$(ls mobile/androidApp/build/outputs/apk/full/release/*.apk | head -n 1)"
          fi
          cp "${apk}" out/Nuvio-LiveTV-Android-TV.apk
          ls -la out

      - name: Upload the Android TV APK
        uses: actions/upload-artifact@v7
        with:
          name: android-tv
          path: out/Nuvio-LiveTV-Android-TV.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    env:
      KEYSTORE_BASE64: ${{ secrets.LIVE_TV_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.LIVE_TV_KEYSTORE_PASSWORD }}
    steps:
      - name: Get the Live TV patch from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            windows-live-tv.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Desktop source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: ${{ env.NUVIO_DESKTOP_COMMIT }}
          path: desktop

      - name: Add Live TV to the desktop app
        working-directory: desktop
        shell: pwsh
        run: |
          $patchFile = Join-Path $env:GITHUB_WORKSPACE "fork/windows-live-tv.patch"
          if (-not (Test-Path $patchFile)) {
            Write-Error "windows-live-tv.patch was not found. Upload it to the top level of your repository (next to README.md), then run this build again."
            exit 1
          }
          git apply --whitespace=nowarn $patchFile
          if ($LASTEXITCODE -ne 0) {
            git apply --ignore-whitespace --whitespace=nowarn $patchFile
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Error "windows-live-tv.patch did not apply."
            exit 1
          }
          Write-Host "Live TV added: $((git status --short | Measure-Object -Line).Lines) files changed."

      - name: Install the WebView2 SDK
        shell: pwsh
        run: |
          $nuget = Join-Path $env:RUNNER_TEMP "nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          $packages = Join-Path $env:RUNNER_TEMP "webview2"
          New-Item -ItemType Directory -Force -Path $packages | Out-Null
          & $nuget install "Microsoft.Web.WebView2" -Version $env:WEBVIEW2_VERSION -OutputDirectory $packages -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not download the WebView2 SDK."
            exit 1
          }
          $root = Join-Path $packages "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WebView2 SDK at $root"

      # The desktop player is a native MPV surface. The MSI ships without
      # libmpv-2.dll unless the runtime is downloaded and passed to Gradle, and
      # without it NativePlayerBridge.create() throws "Unable to load
      # libmpv-2.dll" and every playback path strands on a black player surface.
      # Resolve the latest asset dynamically: the mpv-dev-x86_64-*.7z filename
      # changes every build, so a hardcoded URL is brittle.
      - name: Install the MPV runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $mpvDir = Join-Path $env:RUNNER_TEMP "mpv"
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null

          Write-Host "Downloading latest mpv-dev-x86_64 archive from zhongfly/mpv-winbuild..."
          gh release download --repo zhongfly/mpv-winbuild --pattern "mpv-dev-x86_64-*.7z" --dir $mpvDir

          $archive = Get-ChildItem -Path $mpvDir -Filter "mpv-dev-x86_64-*.7z" |
            Where-Object { $_.Name -notmatch 'v3' } |
            Select-Object -First 1

          if (-not $archive) {
            Write-Error "Failed to locate downloaded mpv-dev archive."
            exit 1
          }

          Write-Host "Extracting $($archive.FullName)..."
          & 7z x $archive.FullName "-o$mpvDir" -y
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to extract MPV archive."
            exit 1
          }

          $dll = Get-ChildItem -Path $mpvDir -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "libmpv-2.dll was not found after extraction."
            exit 1
          }

          $runtimeDir = $dll.DirectoryName
          Write-Host "Found libmpv-2.dll in $runtimeDir"
          "MPV_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Look up the latest Gradle version
        id: gradle
        shell: pwsh
        run: |
          try {
            $latest = (Invoke-RestMethod -Uri "https://services.gradle.org/versions/current").version
          } catch {
            $latest = ""
          }
          if (-not $latest) {
            Write-Warning "Could not look up the latest Gradle version; using the pinned $env:FALLBACK_GRADLE."
            $latest = $env:FALLBACK_GRADLE
          }
          Write-Host "Using Gradle $latest (fallback $env:FALLBACK_GRADLE)."
          "version=$latest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Use the latest Gradle
        working-directory: desktop
        shell: pwsh
        run: |
          $file = "gradle/wrapper/gradle-wrapper.properties"
          (Get-Content $file) -replace "gradle-[0-9][0-9.]*-(bin|all)\.zip", "gradle-${{ steps.gradle.outputs.version }}-`$1.zip" | Set-Content $file
          Select-String -Path $file -Pattern "distributionUrl"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare sign-in settings
        working-directory: desktop
        shell: pwsh
        run: |
          @(
            "NUVIO_SUPABASE_URL=$env:NUVIO_API_URL"
            "NUVIO_SUPABASE_ANON_KEY=$env:NUVIO_API_KEY"
          ) | Out-File -FilePath "local.properties" -Encoding utf8

      - name: Build the installer
        working-directory: desktop
        shell: pwsh
        run: |
          $args = @(
            ":composeApp:packageReleaseMsi"
            "-Pnuvio.desktop.versionName=0.1.$((9000 + [int]$env:GITHUB_RUN_NUMBER))"
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT"
            "-Pnuvio.windows.libmpv.runtimeDir=$env:MPV_RUNTIME_DIR"
            "-Pcompose.desktop.packaging.checkJdkVendor=false"
            "--stacktrace"
          )
          & ./gradlew @args
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Warning "The build failed with Gradle ${{ steps.gradle.outputs.version }}; trying again with the pinned Gradle $env:FALLBACK_GRADLE."
          & ./gradlew --stop
          $file = "gradle/wrapper/gradle-wrapper.properties"
          (Get-Content $file) -replace "gradle-[0-9][0-9.]*-(bin|all)\.zip", "gradle-$env:FALLBACK_GRADLE-`$1.zip" | Set-Content $file
          & ./gradlew @args

      - name: Collect the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $msi = Get-ChildItem -Path "desktop/composeApp/build/compose/release-msis/*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "out/Nuvio-LiveTV-Windows.msi"
          Get-ChildItem out

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/Nuvio-LiveTV-Windows.msi
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, android-tv, windows]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.android.result == 'success' || needs.android-tv.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="live-tv-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          **Android phone and tablet:** download `Nuvio-LiveTV-Android-phone.apk`, open it, and allow installing from this source when asked.
          It installs next to the official Nuvio app as **Nuvio Live TV**. The `older-32bit`, `x86` and `x86_64` files are for unusual devices; most phones want the `phone` file.

          **Android TV, Google TV and Fire TV:** download `Nuvio-LiveTV-Android-TV.apk` and install it on the TV.
          It installs next to the official Nuvio app as **Nuvio Live TV**, with a TV launcher entry and a couch-distance guide layout.
          Fire TV does not show app-provided home screen rows, so those are skipped there.

          **Windows desktop:** download `Nuvio-LiveTV-Windows.msi` and double-click it.
          It replaces the regular Nuvio desktop app and keeps your settings. If Nuvio later offers an app update, skip it: that update doesn't include Live TV.

          Sign in with your Nuvio account, then open the **Live TV** tab and paste your addon's manifest link.
          NOTES
          gh release create "${tag}" dist/* --title "Nuvio Live TV — build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --target "${GITHUB_SHA}" --latest
