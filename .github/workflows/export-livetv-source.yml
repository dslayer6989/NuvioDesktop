name: Export Live TV source for review

# Run by hand (Actions tab > Export Live TV source for review > Run workflow).
# Applies each patch to its pinned Nuvio base and saves the readable text files
# (not fonts or images) to a branch called livetv-source in this repository.
# It never touches Dev and never starts the build.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-livetv-source
  cancel-in-progress: false

env:
  NUVIO_DESKTOP_COMMIT: b1e00724c55e65f8f325d4d9d52eb6827872a7c2
  NUVIO_MOBILE_COMMIT: c1065d0a2a717d7dba445257f064f3fb8d1b30a3

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      # Leave persist-credentials at its default (Nuvio's repos have the libass-android gitlink).
      - name: Get the patches from this repository
        uses: actions/checkout@v6
        with:
          path: fork
          sparse-checkout: |
            windows-live-tv.patch
            android-live-tv.patch
            contribution-live-tv.patch
            contribution-profile-fix.patch
          sparse-checkout-cone-mode: false

      - name: Get the official Nuvio Desktop source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioDesktop
          ref: ${{ env.NUVIO_DESKTOP_COMMIT }}
          path: desktop

      - name: Get the official Nuvio Mobile source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ env.NUVIO_MOBILE_COMMIT }}
          path: mobile

      - name: Export the text source and push it to the livetv-source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global core.autocrlf false
          OUT="${RUNNER_TEMP}/export"
          mkdir -p "${OUT}"

          # export_patch <repo dir> <base commit> <patch file> <output folder name>
          export_patch() (
            repo="$1"; base="$2"; patch="$3"; name="$4"
            if [[ ! -f "${patch}" ]]; then
              echo "::warning::${patch##*/} is not in the repository, so '${name}' was skipped."
              return 0
            fi
            echo "::group::${name}"
            cd "${GITHUB_WORKSPACE}/${repo}"
            git reset --hard -q "${base}"
            git clean -fdq
            git apply --whitespace=nowarn "${patch}" || git apply --ignore-whitespace --whitespace=nowarn "${patch}"
            git add -A
            dest="${OUT}/${name}"
            mkdir -p "${dest}/added" "${dest}/modified-diffs"
            : > "${dest}/_INDEX.txt"
            : > "${dest}/_SKIPPED.txt"
            git diff --cached --no-renames --numstat | while IFS=$'\t' read -r adds dels path; do
              case "${path}" in
                .github/*|*.ttf|*.otf|*.png|*.jpg|*.jpeg|*.webp|*.jar|*.so|*.dll|*/files/licenses/*)
                  echo "${path}" >> "${dest}/_SKIPPED.txt"; continue ;;
              esac
              if [[ "${adds}" == "-" ]]; then
                echo "${path} (binary)" >> "${dest}/_SKIPPED.txt"; continue
              fi
              if ! git cat-file -e ":${path}" 2>/dev/null; then
                echo "D  ${path}" >> "${dest}/_INDEX.txt"
              elif git cat-file -e "${base}:${path}" 2>/dev/null; then
                mkdir -p "${dest}/modified-diffs/$(dirname "${path}")"
                git diff --cached --no-renames -U5 -- "${path}" > "${dest}/modified-diffs/${path}.diff"
                echo "M  +${adds} -${dels}  ${path}" >> "${dest}/_INDEX.txt"
              else
                mkdir -p "${dest}/added/$(dirname "${path}")"
                git show ":${path}" > "${dest}/added/${path}"
                echo "A  ${adds} lines  ${path}" >> "${dest}/_INDEX.txt"
              fi
            done
            echo "Exported $(wc -l < "${dest}/_INDEX.txt") text files; skipped $(wc -l < "${dest}/_SKIPPED.txt")."
            echo "::endgroup::"
          )

          export_patch desktop "${NUVIO_DESKTOP_COMMIT}" "${GITHUB_WORKSPACE}/fork/windows-live-tv.patch" desktop
          export_patch mobile  "${NUVIO_MOBILE_COMMIT}"  "${GITHUB_WORKSPACE}/fork/android-live-tv.patch" android
          export_patch desktop "${NUVIO_DESKTOP_COMMIT}" "${GITHUB_WORKSPACE}/fork/contribution-live-tv.patch" contribution-live-tv
          export_patch desktop "${NUVIO_DESKTOP_COMMIT}" "${GITHUB_WORKSPACE}/fork/contribution-profile-fix.patch" contribution-profile-fix

          # Small comparison files so the shared code only has to be read once.
          cd "${OUT}"
          if [[ -d desktop/added && -d android/added ]]; then
            diff -ru desktop/added android/added > desktop-vs-android.diff || true
          fi
          if [[ -d desktop/added && -d contribution-live-tv/added ]]; then
            diff -ru desktop/added contribution-live-tv/added > desktop-vs-contribution.diff || true
          fi

          cat > README.md <<'EOF'
          Read-only export of the Live TV patches, made by export-livetv-source.yml.
          desktop/ = windows-live-tv.patch applied to the pinned NuvioDesktop commit.
          android/ = android-live-tv.patch applied to the pinned NuvioMobile commit.
          contribution-*/ = the plain upstream-contribution patches (if present).
          added/ holds complete new files. modified-diffs/ holds one diff per changed file.
          _INDEX.txt lists every exported file. _SKIPPED.txt lists binaries and other skipped files.
          EOF
          find . -type f -not -path './.git/*' -printf '%s\t%P\n' | sort -t$'\t' -k2 > MANIFEST.txt

          git init -q -b livetv-source
          git add -A
          git commit -q -m "Live TV source export"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/livetv-source
          echo "::notice::Branch livetv-source is ready in ${GITHUB_REPOSITORY}."
